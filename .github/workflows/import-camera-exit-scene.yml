name: Import camera exit scene

on:
  push:
    branches:
      - ui/login-camera-exit-sequence

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/login-camera-exit-sequence
          fetch-depth: 0

      - name: Build optimized exit scene
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick webp
          mkdir -p public/auth/creative
          U=''
          curl -L --fail --retry 3 "$(printf '%s' "$U" | base64 -d)" -o /tmp/exit-full.png
          convert /tmp/exit-full.png -crop 1050x941+0+0 +repage /tmp/exit-crop.png
          cwebp -quiet -q 84 -m 6 -mt /tmp/exit-crop.png -o public/auth/creative/exit.webp

      - name: Commit optimized exit scene
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/auth/creative/exit.webp
          git diff --cached --quiet && exit 0
          git commit -m "assets: add camera exit scene"
          git push origin HEAD:ui/login-camera-exit-sequence
