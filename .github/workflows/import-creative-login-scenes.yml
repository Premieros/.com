name: Import lightweight creative login scenes

on:
  push:
    branches:
      - feat/login-creative-light-scenes

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/login-creative-light-scenes
          fetch-depth: 0

      - name: Fetch optimized scene assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/auth/creative
          T=''
          P=''
          D=''
          K=''
          curl -L --fail --retry 3 "$(printf '%s' "$T" | base64 -d)" -o public/auth/creative/tables.webp
          curl -L --fail --retry 3 "$(printf '%s' "$P" | base64 -d)" -o public/auth/creative/pos.webp
          curl -L --fail --retry 3 "$(printf '%s' "$D" | base64 -d)" -o public/auth/creative/dashboard.webp
          curl -L --fail --retry 3 "$(printf '%s' "$K" | base64 -d)" -o public/auth/creative/kitchen.webp

      - name: Commit assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/auth/creative/*.webp
          git diff --cached --quiet && exit 0
          git commit -m "assets: add lightweight creative login scenes"
          git push origin HEAD:feat/login-creative-light-scenes
