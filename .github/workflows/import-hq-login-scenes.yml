name: Import HQ login scenes

on:
  push:
    branches:
      - fix/login-hq-scenes

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/login-hq-scenes
          fetch-depth: 0

      - name: Fetch HQ scenes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/auth/hq
          TABLES=''
          POS=''
          DASH=''
          KITCHEN=''
          EXIT=''
          curl -L --fail --retry 3 "$(printf '%s' "$TABLES" | base64 -d)" -o public/auth/hq/tables.webp
          curl -L --fail --retry 3 "$(printf '%s' "$POS" | base64 -d)" -o public/auth/hq/pos.webp
          curl -L --fail --retry 3 "$(printf '%s' "$DASH" | base64 -d)" -o public/auth/hq/dashboard.webp
          curl -L --fail --retry 3 "$(printf '%s' "$KITCHEN" | base64 -d)" -o public/auth/hq/kitchen.webp
          curl -L --fail --retry 3 "$(printf '%s' "$EXIT" | base64 -d)" -o public/auth/hq/exit.webp

      - name: Commit HQ scenes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/auth/hq/*.webp
          git diff --cached --quiet && exit 0
          git commit -m "assets: add high-quality login scenes"
          git push origin HEAD:fix/login-hq-scenes
