name: Optimize login artwork

on:
  push:
    branches:
      - perf/login-image-loading

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/login-image-loading
          fetch-depth: 0

      - name: Convert exact artwork to high-quality WebP
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          for src in public/auth/exact/login-art-*.png; do
            out="${src%.png}.webp"
            cwebp -quiet -q 90 -m 6 -mt "$src" -o "$out"
          done

      - name: Commit optimized artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/auth/exact/login-art-*.webp
          git diff --cached --quiet && exit 0
          git commit -m "assets: add optimized login artwork"
          git push origin HEAD:perf/login-image-loading
