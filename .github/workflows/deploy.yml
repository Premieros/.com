name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: hvqlkapynjfjikqithvd
  VITE_SUPABASE_URL: https://hvqlkapynjfjikqithvd.supabase.co
  VITE_SUPABASE_ANON_KEY: sb_publishable_9W6651rcdIsyBoegwGe_qw_MvCPRIPK
  VITE_WORK_AUTHORIZATION_GATE: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Verify locked Supabase project identity
        run: node scripts/db/verify-database-identity.js

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  production-parity:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Verify locked Supabase project identity
        run: node scripts/db/verify-database-identity.js
      - name: Verify frontend API contract is current
        run: node scripts/db/gen-contract.js --check
      - name: Verify Production API parity
        run: node scripts/db/check-production-parity.js

  deploy:
    needs: [build, production-parity]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
