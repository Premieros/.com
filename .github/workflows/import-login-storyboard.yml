name: Import login storyboard sprite

on:
  push:
    branches:
      - feat/login-storyboard-sequence

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/login-storyboard-sequence
          fetch-depth: 0

      - name: Fetch storyboard sprite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/auth/storyboard
          U=''
          curl -L --fail --retry 3 "$(printf '%s' "$U" | base64 -d)" -o public/auth/storyboard/premier-storyboard.webp

      - name: Commit sprite
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/auth/storyboard/premier-storyboard.webp
          git diff --cached --quiet && exit 0
          git commit -m "assets: add login storyboard sprite"
          git push origin HEAD:feat/login-storyboard-sequence
