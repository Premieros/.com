name: Import login storyboard sequence

on:
  push:
    branches:
      - feat/login-storyboard-sequence

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/login-storyboard-sequence
          fetch-depth: 0

      - name: Fetch and split storyboard
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick webp
          mkdir -p public/auth/storyboard /tmp/premier-frames
          U=''
          curl -L --fail --retry 3 "$(printf '%s' "$U" | base64 -d)" -o /tmp/premier-storyboard.webp
          convert /tmp/premier-storyboard.webp -crop 4x3@ +repage /tmp/premier-frames/frame-%02d.png
          i=1
          for src in /tmp/premier-frames/frame-*.png; do
            out="public/auth/storyboard/scene-$(printf '%02d' "$i").webp"
            cwebp -quiet -q 82 -m 6 -mt "$src" -o "$out"
            i=$((i+1))
          done

      - name: Commit sequence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/auth/storyboard/scene-*.webp
          git diff --cached --quiet && exit 0
          git commit -m "assets: add lightweight storyboard scene sequence"
          git push origin HEAD:feat/login-storyboard-sequence
