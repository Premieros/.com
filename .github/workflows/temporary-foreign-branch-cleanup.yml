name: Temporary foreign branch cleanup

on:
  push:
    branches:
      - fix/database-identity-cleanup-20261003

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove stale foreign-project branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --prune
          for ref in             development/sync-johna-stability-costing-20260929             development/sync-johna-stable-features-20260929             development/original-sync-20260927
          do
            if git ls-remote --exit-code --heads origin "$ref" >/dev/null 2>&1; then
              git push origin --delete "$ref"
            fi
          done
