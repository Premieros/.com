name: History exact55 candidate safety
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  isolated-safety:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify isolated metadata candidate (no hosted credentials)
        env:
          HISTORY55_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: node --test scripts/db/candidates/reconcile-history-exact55.test.mjs scripts/db/candidates/history-closeout-runtime.test.mjs
