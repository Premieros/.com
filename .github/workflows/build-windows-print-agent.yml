name: Build Windows Print Agent

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'electron/**'
      - 'src/features/pos/services/**print**'
      - 'src/features/pos/services/kitchen.ts'
      - 'src/features/pos/components/settings/**'
      - 'src/app/App.tsx'
      - 'supabase/migrations/**cloud_print**'
      - '.github/workflows/build-windows-print-agent.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies including Windows native optionals
        run: |
          npm install --include=optional --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @rollup/rollup-win32-x64-msvc@4.63.0

      - name: Build web app
        run: npm run build

      - name: Install Print Agent dependencies
        working-directory: electron
        shell: pwsh
        run: |
          # Electron / electron-builder downloads occasionally return upstream 502–504.
          # Retry only transient network failures; fail immediately on code/config errors.
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Download attempt $attempt/3"
            $buildLog = @(& npm install --include=optional --no-audit --no-fund 2>&1)
            $exitCode = $LASTEXITCODE
            $buildLog | ForEach-Object { Write-Host $_ }
            if ($exitCode -eq 0) { exit 0 }
            $transient = ($buildLog -join "`n") -match '(?i)(response code 50[234]|gateway time-out|ETIMEDOUT|ECONNRESET|socket hang up)'
            if ($attempt -eq 3 -or -not $transient) { exit $exitCode }
            Start-Sleep -Seconds (15 * $attempt)
          }

      - name: Test isolated printer queues
        run: node electron/printerQueue.test.cjs

      - name: Build Windows installer and portable app
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Windows package build attempt $attempt/3"
            $buildLog = @(& npm run build:win 2>&1)
            $exitCode = $LASTEXITCODE
            $buildLog | ForEach-Object { Write-Host $_ }
            if ($exitCode -eq 0) { exit 0 }
            $transient = ($buildLog -join "`n") -match '(?i)(response code 50[234]|gateway time-out|ETIMEDOUT|ECONNRESET|socket hang up)'
            if ($attempt -eq 3 -or -not $transient) { exit $exitCode }
            Start-Sleep -Seconds (15 * $attempt)
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: premier-print-agent-windows
          path: |
            electron/release/*.exe
            electron/release/*.blockmap
          if-no-files-found: error
          retention-days: 14
