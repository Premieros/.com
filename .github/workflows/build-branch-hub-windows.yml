name: Build PremierOS Branch Hub for Windows
on:
  workflow_dispatch:
  push:
    paths:
      - 'branch-hub/**'
      - '.github/workflows/build-branch-hub-windows.yml'
jobs:
  windows-build:
    timeout-minutes: 15
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Unit tests
        working-directory: branch-hub
        run: npm test
      - name: Install packager
        working-directory: branch-hub
        run: npm ci --no-audit --no-fund
      - name: Package Windows installer
        working-directory: branch-hub
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify packaged Electron runtime and installer identity
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = "1"
          $runtime = Resolve-Path "branch-hub/release/win-unpacked/PremierOS Branch Hub.exe"
          $smoke = Join-Path (Split-Path $runtime) "resources/app.asar/packaged-smoke.cjs"
          $process = Start-Process -FilePath $runtime.Path -ArgumentList "`"$smoke`"" -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Packaged runtime smoke failed: $($process.ExitCode)" }
          Remove-Item Env:ELECTRON_RUN_AS_NODE
          $installers = @(Get-ChildItem branch-hub/release/*Setup*.exe)
          if ($installers.Count -ne 1) { throw "Expected one Windows installer" }
          $exe = $installers[0]
          $installDir = Join-Path $env:RUNNER_TEMP "hub-install-validation"
          $setup = Start-Process -FilePath $exe.FullName -ArgumentList "/S", "/D=$installDir" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Silent installation failed" }
          $installedExe = Join-Path $installDir "PremierOS Branch Hub.exe"
          if (!(Test-Path $installedExe)) { throw "Installed executable missing" }
          $env:ELECTRON_RUN_AS_NODE = "1"
          $installedSmoke = Join-Path $installDir "resources/app.asar/packaged-smoke.cjs"
          $installed = Start-Process -FilePath $installedExe -ArgumentList "`"$installedSmoke`"" -Wait -PassThru -NoNewWindow
          if ($installed.ExitCode -ne 0) { throw "Installed application smoke failed" }
          Remove-Item Env:ELECTRON_RUN_AS_NODE
          $stream = [System.IO.File]::OpenRead($exe.FullName)
          try {
            if ($stream.ReadByte() -ne 77 -or $stream.ReadByte() -ne 90) { throw "Invalid PE installer" }
          } finally { $stream.Dispose() }
          (Get-FileHash $exe.FullName -Algorithm SHA256).Hash + "  " + $exe.Name | Set-Content ($exe.FullName + ".sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: PremierOS-Branch-Hub-Windows-Prototype
          path: |
            branch-hub/release/*.exe
            branch-hub/release/*.sha256
          if-no-files-found: error
