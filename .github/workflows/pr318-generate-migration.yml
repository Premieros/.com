name: PR318 Generate canonical migration filename
on:
  push:
    branches: [fix/product-composition-persistence-20261125]
    paths: ['.github/workflows/pr318-generate-migration.yml']
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.39.2
      - name: Generate migration locally (no project link or database access)
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase migration new --help
          supabase migration new pr318_operational_atomicity
          file="$(find supabase/migrations -maxdepth 1 -name '*_pr318_operational_atomicity.sql' -print)"
          test "$(printf '%s\n' "$file" | wc -l)" -eq 1
          test -f "$file"
          printf 'GENERATED_MIGRATION=%s\n' "$file"
          printf '%s\n' "$file" > pr318-migration-path.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pr318-migration-path
          path: pr318-migration-path.txt
          retention-days: 3
