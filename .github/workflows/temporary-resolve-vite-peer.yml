name: Resolve Vite peer compatibility (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  resolve:
    if: github.head_ref == 'fix/vite-vitest-peer-compat-20261125' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve compatible Vite 7 using the registry
        run: npm install --package-lock-only --ignore-scripts --strict-peer-deps --save-dev --save-exact vite@7
      - name: Record generated manifests for review
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const [name, path] of [['PACKAGE','package.json'],['LOCK','package-lock.json']]) {
            const value = Buffer.from(fs.readFileSync(path)).toString('base64');
            const chunks = value.match(/.{1,3000}/g);
            console.log('PREMIER_' + name + '_TOTAL:' + chunks.length);
            chunks.forEach((chunk,i) => console.log('PREMIER_' + name + '_CHUNK:' + i + ':' + chunk));
          }
          NODE
      - name: Preserve generated manifests
        uses: actions/upload-artifact@v4
        with:
          name: vite-compatible-manifests
          path: |
            package.json
            package-lock.json
          retention-days: 3
      - name: Clean install with strict peer checks
        run: npm ci --strict-peer-deps
      - name: Verify toolchain dependency tree
        run: npm ls vite vitest @vitest/mocker @vitejs/plugin-react
      - name: Verify application build
        env:
          VITE_SUPABASE_URL: https://hvqlkapynjfjikqithvd.supabase.co
          VITE_SUPABASE_ANON_KEY: dummy_anon_key_for_ci_build
          VERCEL: '1'
        run: npm run build
