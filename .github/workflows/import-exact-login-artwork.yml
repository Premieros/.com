name: Import exact login artwork

on:
  push:
    branches:
      - fix/login-exact-designed-images

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/login-exact-designed-images
          fetch-depth: 0

      - name: Download exact approved artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/auth/exact
          curl -L --fail --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/063186e1-7c41-49a8-af4e-c8eb46eb17f2.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZDdiNjBmYTVkN2MwOTgxNCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTU4NjU5N30.DFFwC_BquET9safhB626_r7UZf4KTdISFYWrfl1hbpc' -o public/auth/exact/login-art-1.png
          curl -L --fail --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/2ebd003b-239f-4002-8f81-dd542276e707.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZGE5ZWFkODgzZjM5OTc3MCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTY1NjIwMH0.NK1qzYHCXQRX3cYxwa01p5bEkCpseiUz_NiqyTWI3Aw' -o public/auth/exact/login-art-2.png
          curl -L --fail --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/9cfe5de9-00ab-4875-bbb9-efbfb6ab5f13.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZTQwMWQ5ZjIyOTVlOTQ3YiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTY0MzM3OH0.JIbqfGxxLs-ogOaLiUOEcBZtVyK1ghd6j7AT3ZjTS1s' -o public/auth/exact/login-art-3.png
          curl -L --fail --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/61a3382a-cfdf-4776-bcc1-668df5cdf20f.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNjc4MWMwZDRhMDY4OTM5MiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTU5MzU1Nn0.QlncUtav7jRzLwwvbngdJCptlfRWu9L4lcjWM8HS8kk' -o public/auth/exact/login-art-4.png
          curl -L --fail --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/43240241-4a7f-4688-8492-21012ecb19d6.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZTc4ZmExNDE4OGEzMTI5MyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTY1MDYyNX0.UXKiFcEKT76wxadQNp5jx1GSkgeb5Mws8L7wRODwir4' -o public/auth/exact/login-art-5.png
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for path in sorted(Path("public/auth/exact").glob("login-art-*.png")):
              with Image.open(path) as im:
                  assert im.size == (1672, 941), (path, im.size)
          PY

      - name: Commit exact artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/auth/exact/login-art-*.png
          git diff --cached --quiet && exit 0
          git commit -m "assets: add exact approved login artwork"
          git push origin HEAD:fix/login-exact-designed-images
