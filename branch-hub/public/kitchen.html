<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شاشة المطبخ الذكية KDS — PremierOS Kitchen Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090b10;
      --card-bg: #151922;
      --border: rgba(255, 255, 255, 0.12);
      --new-border: #f59e0b;
      --new-bg: rgba(245, 158, 11, 0.08);
      --prep-border: #3b82f6;
      --prep-bg: rgba(59, 130, 246, 0.08);
      --ready-border: #10b981;
      --ready-bg: rgba(16, 185, 129, 0.08);
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    header {
      background: #11151f;
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .header-title { font-size: 20px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .badge {
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .filter-tabs { display: flex; gap: 6px; }
    .tab-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #8054f6;
      color: #fff;
      border-color: #8054f6;
    }
    .btn {
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-icon { background: rgba(255, 255, 255, 0.08); color: #fff; border: 1px solid var(--border); }
    .btn-icon:hover { background: rgba(255, 255, 255, 0.16); }

    .main-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
      padding: 20px;
      flex: 1;
    }

    .order-card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 2px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .order-card.new { border-color: var(--new-border); background: var(--new-bg); }
    .order-card.preparing { border-color: var(--prep-border); background: var(--prep-bg); }
    .order-card.ready { border-color: var(--ready-border); background: var(--ready-bg); box-shadow: 0 0 20px rgba(16, 185, 129, 0.3); }

    .card-header {
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.25);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .order-num { font-size: 22px; font-weight: 900; }
    .order-type-badge {
      font-size: 12px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
    }
    .card-meta {
      padding: 8px 16px;
      font-size: 13px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .timer {
      font-weight: 800;
      color: #38bdf8;
      font-family: monospace;
      font-size: 14px;
    }
    .timer.late { color: #f87171; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0.5; } }

    .items-list {
      padding: 14px 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 380px;
      overflow-y: auto;
    }
    .item-row {
      display: flex;
      flex-direction: column;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .item-main {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .item-qty {
      background: #8054f6;
      color: #fff;
      font-size: 14px;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: 6px;
      min-width: 32px;
      text-align: center;
    }
    .item-name { font-size: 16px; font-weight: 800; }
    .item-note {
      font-size: 12px;
      font-weight: 700;
      color: #fbbf24;
      background: rgba(245, 158, 11, 0.12);
      padding: 3px 8px;
      border-radius: 6px;
      margin-top: 4px;
      margin-right: 42px;
    }

    .card-actions {
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.35);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }
    .action-btn {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .action-btn:active { transform: scale(0.97); }
    .btn-prep { background: #2563eb; color: #fff; }
    .btn-prep:hover { background: #3b82f6; }
    .btn-ready { background: #059669; color: #fff; }
    .btn-ready:hover { background: #10b981; }
    .btn-complete { background: #475569; color: #fff; }
    .btn-complete:hover { background: #64748b; }
    .empty-state {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
      color: var(--muted);
      text-align: center;
    }
    .empty-state span { font-size: 48px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <div class="header-title">
        <span>🍳</span>
        <span>شاشة المطبخ الذكية (KDS)</span>
      </div>
      <span id="orderCountBadge" class="badge">0 طلبات نشطة</span>
      <div class="filter-tabs">
        <button class="tab-btn active" onclick="setFilter('all')">الكل</button>
        <button class="tab-btn" onclick="setFilter('new')">جديد 🟡</button>
        <button class="tab-btn" onclick="setFilter('preparing')">قيد التجهيز 🔵</button>
        <button class="tab-btn" onclick="setFilter('ready')">جاهز 🟢</button>
      </div>
    </div>
    <div class="header-right">
      <button id="soundToggle" class="btn btn-icon" onclick="toggleSound()">🔊 الصوت مفعّل</button>
      <button class="btn btn-icon" onclick="toggleFullScreen()">⛶ ملء الشاشة</button>
      <a href="/hub" class="btn btn-icon">⚙️ الإعدادات</a>
    </div>
  </header>

  <main id="ordersGrid" class="main-grid">
    <div class="empty-state">
      <span>👨‍🍳</span>
      <h3>لا توجد طلبات معلقة حالياً</h3>
      <p>ستظهر الطلبات الجديدة تلقائياً فور إرسالها من الكاشير أو هواتف الويتر</p>
    </div>
  </main>

  <script>
    let activeOrders = [];
    let currentFilter = 'all';
    let soundEnabled = true;

    // Web Audio API Pleasant Chime (No external audio files required)
    function playChime(type = 'new_order') {
      if (!soundEnabled) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'new_order') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
          osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15); // A5
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
          osc.start();
          osc.stop(ctx.currentTime + 0.6);
        } else if (type === 'order_ready') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
          osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.7);
          osc.start();
          osc.stop(ctx.currentTime + 0.7);
        }
      } catch (e) {
        console.warn('Audio chime failed:', e);
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('soundToggle');
      btn.textContent = soundEnabled ? '🔊 الصوت مفعّل' : '🔇 الصوت صامت';
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('onclick').includes(filter));
      });
      renderOrders();
    }

    async function loadActiveOrders() {
      try {
        const res = await fetch('/api/orders?status=active');
        if (res.ok) {
          activeOrders = await res.json();
          renderOrders();
        }
      } catch (e) {
        console.error('Failed to load orders', e);
      }
    }

    function formatElapsed(createdAt) {
      const elapsedSec = Math.max(0, Math.floor((Date.now() - new Date(createdAt).getTime()) / 1000));
      const mins = Math.floor(elapsedSec / 60);
      const secs = elapsedSec % 60;
      return {
        text: `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`,
        isLate: mins >= 15
      };
    }

    async function updateStatus(orderId, status) {
      try {
        const res = await fetch(`/api/orders/${orderId}/status`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status })
        });
        if (res.ok) {
          if (status === 'completed' || status === 'cancelled') {
            activeOrders = activeOrders.filter(o => o.id !== orderId);
          } else {
            const updated = await res.json();
            const idx = activeOrders.findIndex(o => o.id === orderId);
            if (idx !== -1) activeOrders[idx] = updated;
          }
          if (status === 'ready') playChime('order_ready');
          renderOrders();
        }
      } catch (e) {
        console.error(e);
      }
    }

    function renderOrders() {
      const grid = document.getElementById('ordersGrid');
      const filtered = activeOrders.filter(o => {
        if (currentFilter === 'all') return true;
        return o.status === currentFilter;
      });

      document.getElementById('orderCountBadge').textContent = `${activeOrders.length} طلبات نشطة`;

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <span>👨‍🍳</span>
            <h3>لا توجد طلبات في هذا القسم</h3>
            <p>جميع الطلبات تم إنجازها بنجاح</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(order => {
        const elapsed = formatElapsed(order.created_at);
        const typeLabel = order.order_type === 'dine_in'
          ? (order.table_name || 'طاولة')
          : (order.order_type === 'takeaway' ? 'سفري / تيك أواي' : 'توصيل');

        let actionBtn = '';
        if (order.status === 'new') {
          actionBtn = `<button class="action-btn btn-prep" onclick="updateStatus('${order.id}', 'preparing')">▶️ بدء التجهيز</button>`;
        } else if (order.status === 'preparing') {
          actionBtn = `<button class="action-btn btn-ready" onclick="updateStatus('${order.id}', 'ready')">✅ جاهز للتقديم</button>`;
        } else if (order.status === 'ready') {
          actionBtn = `<button class="action-btn btn-complete" onclick="updateStatus('${order.id}', 'completed')">🍽️ تم التسليم</button>`;
        }

        const itemsHtml = (order.items || []).map(it => `
          <div class="item-row">
            <div class="item-main">
              <span class="item-qty">${it.quantity}x</span>
              <span class="item-name">${it.product_name}</span>
            </div>
            ${it.notes ? `<div class="item-note">💡 ${it.notes}</div>` : ''}
          </div>
        `).join('');

        return `
          <div class="order-card ${order.status}" id="card-${order.id}">
            <div class="card-header">
              <span class="order-num">#${order.order_number}</span>
              <span class="order-type-badge">${typeLabel}</span>
            </div>
            <div class="card-meta">
              <span>الويتر: ${order.waiter_name || 'الكاشير'}</span>
              <span class="timer ${elapsed.isLate ? 'late' : ''}" data-created="${order.created_at}">${elapsed.text}</span>
            </div>
            <div class="items-list">
              ${itemsHtml}
              ${order.notes ? `<div class="item-note" style="margin: 0; background: rgba(239,68,68,0.15); color: #f87171;">⚠️ ملاحظة عامة: ${order.notes}</div>` : ''}
            </div>
            <div class="card-actions">
              ${actionBtn}
            </div>
          </div>
        `;
      }).join('');
    }

    // Live Server-Sent Events (SSE) Listener
    function setupSSE() {
      const evtSource = new EventSource('/api/events');
      evtSource.addEventListener('order_created', (e) => {
        try {
          const newOrder = JSON.parse(e.data);
          const exists = activeOrders.some(o => o.id === newOrder.id);
          if (!exists) {
            activeOrders.unshift(newOrder);
            playChime('new_order');
            renderOrders();
          }
        } catch (err) {
          console.error(err);
        }
      });

      evtSource.addEventListener('order_status_updated', (e) => {
        try {
          const updated = JSON.parse(e.data);
          if (updated.status === 'completed' || updated.status === 'cancelled') {
            activeOrders = activeOrders.filter(o => o.id !== updated.id);
          } else {
            const idx = activeOrders.findIndex(o => o.id === updated.id);
            if (idx !== -1) activeOrders[idx] = updated;
          }
          renderOrders();
        } catch (err) {
          console.error(err);
        }
      });

      evtSource.onerror = () => {
        setTimeout(setupSSE, 3000);
      };
    }

    // Refresh timers every second
    setInterval(() => {
      document.querySelectorAll('.timer').forEach(el => {
        const created = el.getAttribute('data-created');
        if (created) {
          const elapsed = formatElapsed(created);
          el.textContent = elapsed.text;
          el.classList.toggle('late', elapsed.isLate);
        }
      });
    }, 1000);

    // Initial load
    loadActiveOrders();
    setupSSE();
  </script>
</body>
</html>
