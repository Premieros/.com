<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام طلبات الويتر — PremierOS Waiter Handheld</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090517;
      --card-bg: #140d28;
      --border: rgba(255, 255, 255, 0.12);
      --primary: #8054f6;
      --primary-hover: #946fff;
      --text: #f8fafc;
      --muted: #94a3b8;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* PIN Login Screen */
    .pin-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 20%, #221245 0%, #090517 80%);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .pin-title { font-size: 22px; font-weight: 900; margin-bottom: 6px; }
    .pin-sub { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
    .pin-dots {
      display: flex;
      gap: 14px;
      margin-bottom: 30px;
    }
    .pin-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.3);
      transition: all 0.2s;
    }
    .pin-dot.filled {
      background: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 0 12px var(--primary);
    }
    .pin-keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 280px;
    }
    .pin-btn {
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: #fff;
      font-size: 24px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
    }
    .pin-btn:active { background: rgba(255, 255, 255, 0.25); transform: scale(0.92); }

    /* App Header */
    header {
      background: #140d28;
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .staff-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.08);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .current-table-pill {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
    }

    /* Navigation Bar */
    .nav-tabs {
      display: flex;
      background: #0f0920;
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
      gap: 8px;
    }
    .nav-tab {
      flex: 1;
      padding: 10px;
      border-radius: 12px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .nav-tab.active {
      background: var(--primary);
      color: #fff;
    }

    /* Content Panes */
    .tab-content { display: none; flex: 1; padding: 14px; overflow-y: auto; }
    .tab-content.active { display: block; }

    /* Tables Grid */
    .tables-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 12px;
    }
    .table-card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 16px;
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 8px;
      text-align: center;
      transition: all 0.2s;
    }
    .table-card:active { transform: scale(0.95); }
    .table-card.vacant { border-color: rgba(16, 185, 129, 0.4); background: rgba(16, 185, 129, 0.05); }
    .table-card.occupied { border-color: rgba(245, 158, 11, 0.5); background: rgba(245, 158, 11, 0.1); }
    .table-card.selected { border-color: #8054f6; box-shadow: 0 0 16px rgba(128, 84, 246, 0.6); }
    .table-name { font-size: 15px; font-weight: 900; }
    .table-status { font-size: 11px; font-weight: 700; margin-top: 4px; }
    .table-status.vacant { color: #34d399; }
    .table-status.occupied { color: #fbbf24; }

    /* Menu / Categories */
    .categories-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 12px;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
    }
    .cat-pill {
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }
    .cat-pill.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
    }
    .prod-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      min-height: 110px;
    }
    .prod-card:active { transform: scale(0.97); }
    .prod-name { font-size: 14px; font-weight: 800; line-height: 1.3; margin-bottom: 8px; }
    .prod-price { font-size: 15px; font-weight: 900; color: #38bdf8; }

    /* Cart Drawer / Bottom Bar */
    .bottom-bar {
      position: sticky;
      bottom: 0;
      background: #140d28;
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      z-index: 90;
    }
    .cart-summary {
      display: flex;
      flex-direction: column;
    }
    .cart-count { font-size: 12px; color: var(--muted); }
    .cart-total { font-size: 18px; font-weight: 900; color: #38bdf8; }
    .btn-send {
      flex: 1;
      background: var(--primary);
      color: #fff;
      padding: 12px 20px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 900;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(128, 84, 246, 0.4);
    }
    .btn-send:active { transform: scale(0.97); }

    /* Toast & Notifications */
    .notify-banner {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      background: #059669;
      color: #fff;
      padding: 14px 20px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      z-index: 2000;
      display: flex;
      align-items: center;
      gap: 10px;
      transform: translateY(-120%);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .notify-banner.show { transform: translateY(0); }
  </style>
</head>
<body>
  <!-- PIN Login Modal -->
  <div id="pinScreen" class="pin-screen">
    <div style="font-size: 40px; margin-bottom: 8px;">📱</div>
    <h2 class="pin-title">تسجيل دخول الويتر</h2>
    <p class="pin-sub">أدخل رمز PIN الخاص بك (افتراضي: 3333 أو 1111)</p>
    <div class="pin-dots">
      <div class="pin-dot" id="dot-0"></div>
      <div class="pin-dot" id="dot-1"></div>
      <div class="pin-dot" id="dot-2"></div>
      <div class="pin-dot" id="dot-3"></div>
    </div>
    <div class="pin-keypad">
      <button class="pin-btn" onclick="pressPin('1')">1</button>
      <button class="pin-btn" onclick="pressPin('2')">2</button>
      <button class="pin-btn" onclick="pressPin('3')">3</button>
      <button class="pin-btn" onclick="pressPin('4')">4</button>
      <button class="pin-btn" onclick="pressPin('5')">5</button>
      <button class="pin-btn" onclick="pressPin('6')">6</button>
      <button class="pin-btn" onclick="pressPin('7')">7</button>
      <button class="pin-btn" onclick="pressPin('8')">8</button>
      <button class="pin-btn" onclick="pressPin('9')">9</button>
      <button class="pin-btn" style="font-size: 16px; color: #f87171;" onclick="clearPin()">مسح</button>
      <button class="pin-btn" onclick="pressPin('0')">0</button>
      <button class="pin-btn" style="font-size: 18px;" onclick="backspacePin()">⌫</button>
    </div>
  </div>

  <!-- Notification Banner -->
  <div id="notifyBanner" class="notify-banner">
    <span>🔔</span>
    <span id="notifyText">طلب طاولة جاهز في المطبخ!</span>
  </div>

  <!-- Header -->
  <header>
    <div class="staff-badge" onclick="showPinScreen()">
      <span>👤</span>
      <span id="staffNameDisplay">تسجيل الدخول</span>
    </div>
    <div id="currentTableDisplay" class="current-table-pill" style="display: none;">
      طاولة لم تحدد
    </div>
  </header>

  <!-- Navigation Tabs -->
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="switchTab('tables')">🍽️ الطاولات</button>
    <button class="nav-tab" onclick="switchTab('menu')">🍕 قائمة الأصناف</button>
    <button class="nav-tab" onclick="switchTab('orders')">📋 الطلبات الحية</button>
  </div>

  <!-- Tab 1: Tables Map -->
  <div id="tab-tables" class="tab-content active">
    <div class="tables-grid" id="tablesGrid"></div>
  </div>

  <!-- Tab 2: Menu & Ordering -->
  <div id="tab-menu" class="tab-content">
    <div class="categories-bar" id="categoriesBar"></div>
    <div class="products-grid" id="productsGrid"></div>
  </div>

  <!-- Tab 3: Active Orders -->
  <div id="tab-orders" class="tab-content">
    <div id="activeOrdersList" style="display: flex; flex-direction: column; gap: 12px;"></div>
  </div>

  <!-- Bottom Action Bar -->
  <div id="bottomBar" class="bottom-bar" style="display: none;">
    <div class="cart-summary">
      <span id="cartCount" class="cart-count">0 أصناف</span>
      <span id="cartTotal" class="cart-total">0.00 ج.م</span>
    </div>
    <button class="btn-send" onclick="sendOrderToKitchen()">
      <span>⚡</span>
      <span>إرسال للمطبخ</span>
    </button>
  </div>

  <script>
    let currentStaff = null;
    let enteredPin = '';
    let selectedTable = null;
    let categories = [];
    let products = [];
    let cart = []; // { product, quantity, notes }
    let selectedCategory = null;

    // PIN Pad logic
    function pressPin(digit) {
      if (enteredPin.length < 4) {
        enteredPin += digit;
        updateDots();
        if (enteredPin.length === 4) {
          setTimeout(verifyPin, 150);
        }
      }
    }
    function clearPin() { enteredPin = ''; updateDots(); }
    function backspacePin() { enteredPin = enteredPin.slice(0, -1); updateDots(); }
    function updateDots() {
      for (let i = 0; i < 4; i++) {
        document.getElementById(`dot-${i}`).classList.toggle('filled', i < enteredPin.length);
      }
    }

    async function verifyPin() {
      try {
        const res = await fetch('/api/auth/pin-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: enteredPin })
        });
        const data = await res.json();
        if (data.ok) {
          currentStaff = data.user;
          document.getElementById('staffNameDisplay').textContent = currentStaff.name;
          document.getElementById('pinScreen').style.display = 'none';
          clearPin();
        } else {
          alert(data.error || 'رمز PIN غير صحيح');
          clearPin();
        }
      } catch (err) {
        alert('خطأ في الاتصال: ' + err.message);
        clearPin();
      }
    }

    function showPinScreen() {
      clearPin();
      document.getElementById('pinScreen').style.display = 'flex';
    }

    // Audio chime & vibration
    function playChime(type = 'ready') {
      try {
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(523.25, ctx.currentTime);
        osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
        osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.8);
        osc.start();
        osc.stop(ctx.currentTime + 0.8);
      } catch {}
    }

    function showNotification(msg) {
      playChime();
      const banner = document.getElementById('notifyBanner');
      document.getElementById('notifyText').textContent = msg;
      banner.classList.add('show');
      setTimeout(() => banner.classList.remove('show'), 5000);
    }

    // Tabs
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
      document.getElementById(`tab-${tabId}`).classList.add('active');
      event.target.classList.add('active');
      if (tabId === 'tables') loadTables();
      if (tabId === 'orders') loadActiveOrders();
    }

    // Data Loaders
    async function loadTables() {
      try {
        const res = await fetch('/api/tables');
        const tables = await res.json();
        const grid = document.getElementById('tablesGrid');
        grid.innerHTML = tables.map(t => `
          <div class="table-card ${t.status} ${selectedTable && selectedTable.id === t.id ? 'selected' : ''}" onclick="selectTable(${JSON.stringify(t).replace(/"/g, '&quot;')})">
            <span class="table-name">${t.name}</span>
            <span class="table-status ${t.status}">${t.status === 'occupied' ? 'مشغولة' : 'فاضية'}</span>
          </div>
        `).join('');
      } catch (e) {
        console.error(e);
      }
    }

    function selectTable(table) {
      selectedTable = table;
      const display = document.getElementById('currentTableDisplay');
      display.style.display = 'inline-block';
      display.textContent = `طاولة: ${table.name}`;
      switchTabDirect('menu');
      updateCartUI();
    }

    function switchTabDirect(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('onclick').includes(tabId));
      });
      document.getElementById(`tab-${tabId}`).classList.add('active');
    }

    async function loadCatalog() {
      try {
        const [cRes, pRes] = await Promise.all([fetch('/api/categories'), fetch('/api/products')]);
        categories = await cRes.json();
        products = await pRes.json();

        // Render categories
        const cBar = document.getElementById('categoriesBar');
        cBar.innerHTML = `<button class="cat-pill active" onclick="filterCategory(null)">الكل</button>` +
          categories.map(c => `<button class="cat-pill" onclick="filterCategory('${c.id}')">${c.name}</button>`).join('');

        renderProducts();
      } catch (e) {
        console.error(e);
      }
    }

    function filterCategory(catId) {
      selectedCategory = catId;
      document.querySelectorAll('.cat-pill').forEach(btn => {
        const isAll = catId === null && btn.textContent === 'الكل';
        const isMatch = catId !== null && btn.getAttribute('onclick').includes(catId);
        btn.classList.toggle('active', isAll || isMatch);
      });
      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      const filtered = selectedCategory ? products.filter(p => p.category_id === selectedCategory) : products;
      grid.innerHTML = filtered.map(p => `
        <div class="prod-card" onclick="addToCart(${JSON.stringify(p).replace(/"/g, '&quot;')})">
          <span class="prod-name">${p.name}</span>
          <span class="prod-price">${Number(p.sale_price).toFixed(2)} ج.م</span>
        </div>
      `).join('');
    }

    function addToCart(product) {
      const existing = cart.find(i => i.product.id === product.id);
      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({ product, quantity: 1, notes: '' });
      }
      updateCartUI();
    }

    function updateCartUI() {
      const bottom = document.getElementById('bottomBar');
      if (cart.length > 0) {
        bottom.style.display = 'flex';
        const totalItems = cart.reduce((sum, i) => sum + i.quantity, 0);
        const totalPrice = cart.reduce((sum, i) => sum + (i.quantity * i.product.sale_price), 0);
        document.getElementById('cartCount').textContent = `${totalItems} أصناف في السلة`;
        document.getElementById('cartTotal').textContent = `${totalPrice.toFixed(2)} ج.م`;
      } else {
        bottom.style.display = 'none';
      }
    }

    async function sendOrderToKitchen() {
      if (cart.length === 0) return;
      try {
        const payload = {
          table_id: selectedTable ? selectedTable.id : null,
          table_name: selectedTable ? selectedTable.name : 'طلب مباشر',
          order_type: selectedTable ? 'dine_in' : 'takeaway',
          waiter_name: currentStaff ? currentStaff.name : 'الويتر',
          items: cart.map(i => ({
            product_id: i.product.id,
            product_name: i.product.name,
            quantity: i.quantity,
            unit_price: i.product.sale_price,
            notes: i.notes || ''
          }))
        };

        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          const ord = await res.json();
          showNotification(`تم إرسال الطلب #${ord.order_number} للمطبخ بنجاح!`);
          cart = [];
          updateCartUI();
          switchTabDirect('tables');
        } else {
          const err = await res.json();
          alert(err.error || 'فشل إرسال الطلب');
        }
      } catch (e) {
        alert('خطأ في إرسال الطلب: ' + e.message);
      }
    }

    async function loadActiveOrders() {
      try {
        const res = await fetch('/api/orders?status=active');
        const orders = await res.json();
        const list = document.getElementById('activeOrdersList');
        if (orders.length === 0) {
          list.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--muted);">لا توجد طلبات جارية</div>`;
          return;
        }
        list.innerHTML = orders.map(o => `
          <div style="background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 14px;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
              <span style="font-weight: 900; font-size: 16px;">#${o.order_number} (${o.table_name || 'طاولة'})</span>
              <span style="font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 6px; background: ${o.status === 'ready' ? 'rgba(16,185,129,0.2); color:#34d399' : 'rgba(245,158,11,0.2); color:#fbbf24'};">
                ${o.status === 'ready' ? '✅ جاهز للاستلام' : o.status === 'preparing' ? '⏳ قيد التجهيز' : '🟡 جديد'}
              </span>
            </div>
            <div style="font-size: 13px; color: var(--muted);">الإجمالي: ${Number(o.total).toFixed(2)} ج.م — الويتر: ${o.waiter_name}</div>
          </div>
        `).join('');
      } catch (e) {
        console.error(e);
      }
    }

    // SSE for Live Notifications
    function setupSSE() {
      const evt = new EventSource('/api/events');
      evt.addEventListener('order_status_updated', (e) => {
        try {
          const ord = JSON.parse(e.data);
          if (ord.status === 'ready') {
            showNotification(`🔔 طلب طاولة (${ord.table_name || '#' + ord.order_number}) جاهز في المطبخ!`);
          }
          loadTables();
          loadActiveOrders();
        } catch {}
      });
      evt.onerror = () => setTimeout(setupSSE, 4000);
    }

    // Init
    loadTables();
    loadCatalog();
    setupSSE();
  </script>
</body>
</html>
